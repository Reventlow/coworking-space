# Build the deck image and push it to Docker Hub on every push to main.
# Required repository secrets:
#   DOCKER_HUB_USERNAME     - Docker Hub account name
#   DOCKER_HUB_ACCESS_TOKEN - Docker Hub access token (Read/Write)
name: Build and push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/coworking-space:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/coworking-space:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
