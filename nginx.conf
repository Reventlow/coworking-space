server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Danish filenames and UTF-8 content
    charset utf-8;

    # Cache the component scripts, but always revalidate the deck itself
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
